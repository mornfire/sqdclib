plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.17'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Aliyun'
        url = 'https://maven.aliyun.com/repository/public'
    }
}

configurations {
    jcodecBundle
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.jcodec:jcodec:0.2.5'
    jcodecBundle 'org.jcodec:jcodec:0.2.5'
}

tasks.named('jar', Jar).configure {
    if (project.hasProperty('withVideo')) {
        archiveClassifier = 'video'
        from({ configurations.jcodecBundle.collect { zipTree(it) } }) {
            exclude 'META-INF/MANIFEST.MF'
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
            exclude 'module-info.class'
            exclude 'META-INF/versions/*/module-info.class'
            exclude 'META-INF/maven/**'
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.mod_name,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
